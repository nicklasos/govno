[s3]
bucket = "global-bucket"
region = "us-west-2"
prefix = "mysql/"

[[database]]
name = "shop"
defaults_file = "shop.cnf"

  [[database.vno]]
  name = "daily"
  path = "{db}/daily/{weekday}.sql.gz"

  [[database.vno]]
  name = "monthly"
  path = "{db}/monthly/{year}-{month}.sql.gz"
  keep = 12

[[database]]
name = "blog"
defaults_file = "/etc/govno/blog.cnf"
host = "10.0.0.5"
mysqldump_args = ["--routines"]

  [database.s3]
  bucket = "blog-bucket"
  access_key_id = "AKIA"
  secret_access_key = "secret"

  [[database.vno]]
  name = "daily"
  path = "{db}/{date}.sql.gz"
